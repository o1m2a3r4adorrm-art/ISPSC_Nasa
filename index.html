<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ispsc-frontend</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ispsc_theme') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(135deg, #0F4229, #1A6B42);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #initial-loader.il-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .il-logo {
    width: 88px;
    height: 88px;
    border-radius: 22px;
    background: rgba(255,255,255,.08);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: il-pulse 1.4s ease-in-out infinite;
}

.il-logo img {
    width: 70px;
    height: 70px;
    object-fit: contain;
}
      .il-text {
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        opacity: 0.85;
        letter-spacing: 0.02em;
      }
      .il-dots span {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin: 0 2px;
        border-radius: 50%;
        background: #C9A84C;
        animation: il-bounce 1.2s ease-in-out infinite;
      }
      .il-dots span:nth-child(2) { animation-delay: 0.15s; }
      .il-dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes il-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes il-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
        40% { transform: translateY(-6px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var loader = document.getElementById('initial-loader');
        var root = document.getElementById('root');
        if (!loader || !root) return;

        function hideLoader() {
          loader.classList.add('il-hidden');
          setTimeout(function () { loader.remove(); }, 400);
        }

        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            observer.disconnect();
            hideLoader();
          }
        });
        observer.observe(root, { childList: true });

        setTimeout(hideLoader, 15000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
